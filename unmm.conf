;

; Notações:
; -> $scriptdir - Aponta para o diretório do unmm.sh
; -> K/M/G - Unidades de Dados (Kilobyte/Megabyte/Gigabyte)
; -> true/false - Valores booleanos (verdadeiro/falso)
; -> Listas - Para definir uma lista, use a sintaxe:
;    valor1 valor2 valor3 ... (separados por espaço)
;
;    Exemplo:
;    Includes=addon1 addon2 addon3

;    - Se o elemento inclui espaços, use aspas para delimitar o valor.
;    valor1 valor com espaço valor3 -- ERRADO
;    valor1 "valor com espaço" valor3 -- CORRETO (é opcional usar aspas mesmo para valores sem espaços)
;
; -> Opção vazia - Para definir uma opção sem valor, deixe-a vazia sem nada depois do sinal de igual.
;    Exemplo:
; -> Lista vazia - Para definir uma lista vazia, deixe um _ (underscore).
;    Exemplo:
;    Includes=_ <-- Indica uma lista vazia.

; Define opções gerais
[General]

; Não mostrar a logo
NoLogo=false

; Ponto de Montagem de Desenvolvimento
MountPoint=/mnt/unmm

; Manter artefatos quando erros ocorrem
KeepOnErrors=false

; Caminho da licença
License=$scriptdir/assets/generic_LICENSE

; Diretório de configurações.
ConfigIncludeDir="$scriptdir/config"

; Diretório de saída dos arquivos gerados.
OutputDir="$scriptdir/build"

; Define o logging da aplicação.
[Lib.Logging]

; Detalhamento
Verbose=false

; Controla se marcadores devem ser colorizados no terminal
ColorizeMarkers=true

; Caminho do arquivo de log. Se vazio, os logs serão enviados apenas para o console.
LogFile=$scriptdir/build/unmm.log

; Define configurações do DiskPart
[Lib.DiskPart]

; Tamanho máximo da imagem
MaximumSize=4G

; Backend para criação de image.
; Opções:
;   - raw: Cria um disco pré-alocado e anexa com losetup.
;   - qcow: Cria um disco do tipo QCOW2 e anexa com nbd.
Backend=qcow

; Força re-leitura da tabela de partições após particionar.
; Relevante para qcow/nbd; para raw/losetup normalmente é opcional.
PartprobeAfterPartition=true

; Espera udev concluir operações de dispositivos.
; Relevante para qcow/nbd; para raw/losetup normalmente é opcional.
UdevSettle=true

; Define o sistema
[System]

; Nome do host
Hostname=luimg

; Usuário
User=user

; Senha
Password=password

; Habilitar swap
EnableSwap=true

; Modo de boot
; Opções:
;   - bios: Usa o modo de boot tradicional (BIOS).
;   - uefi: Usa o modo de boot UEFI.
;   - hybrid: Permite ambos os modos, dependendo do ambiente de execução.
BootMode=bios

; Define a memória swap.
[System.Swap]

; Tamanho do Swap
Size=1G

; Define exportação
[Export]

; Tipo de exportação
; Opções
;   - disk: Exporta como um disco comum
;   - ova: Exporta como um Open Virtualization Appliance (OVA).
Type=disk

; Subtipo da exportação
;   Opções
;   * Se disk:
;       - raw: Exporta como um arquivo .img
;       - vdi: Exporta como um arquivo .vdi
;       - qcow2: Exporta como um arquivo .qcow2
;       - vmdk: Exporta como um arquivo .vmdk
;   * Se ova:
;       - generic: Exporta como OVA genérico (sem especificações de um hipervisor específico)
;       - vbox: Export como OVA destinado ao VirtualBox.
Subtype=qcow2

; Específico para exportação OVA
[Export.OVA]

; Nome da VM
Name=luvm

; Informações
Info="Uma máquina virtual criada por UNMM"

; Quantidade de CPUs
CPU=2

; Quantidade de memória
Memory=1G

; Habilitar unidade de CD-ROM
EnableCdRom=true